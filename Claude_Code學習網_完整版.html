id:"ch1",nav:"第1章 整合進軟體工程",tag:"第 1 章",title:"將 Claude Code 整合進軟體工程",
body:`
<p>這一章先回答一個大哉問：<b>什麼是「程式設計代理」？它為什麼現在突然這麼紅？</b>搞懂這點，你才知道 Claude Code 在整個趨勢裡站在哪個位置。</p>
<h3>1.1 什麼是程式設計代理（Coding Agent）</h3>
<p>先拆兩個詞。<b>AI 代理（Agent）</b>是「能自己感知環境、做決定、採取行動」的 AI，而不是你問一句它答一句的聊天機器人。<b>程式設計代理</b>就是專門用在寫程式的 AI 代理。</p>
<div class="callout ex"><span class="lbl">🌰 用「助手」打比方</span>
普通聊天 AI 像<b>問路的路人</b>：你問怎麼走，它告訴你方向，但不會帶你去。<br>
程式設計代理像<b>計程車司機</b>：你說「我要去車站」，它自己看路、轉彎、遇塞車改道，直接把你載到。</div>
<div class="fig">
<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-size="13">
 <text x="180" y="22" fill="var(--muted)" font-size="14" font-weight="bold" text-anchor="middle">一般聊天 AI（問路的路人）</text>
 <rect x="40" y="40" width="120" height="40" rx="8" fill="var(--chip)"/><text x="100" y="65" fill="var(--txt)" text-anchor="middle">你問問題</text>
 <rect x="200" y="40" width="120" height="40" rx="8" fill="var(--chip)"/><text x="260" y="65" fill="var(--txt)" text-anchor="middle">它回答</text>
 <line x1="160" y1="60" x2="198" y2="60" stroke="var(--muted)" stroke-width="2" marker-end="url(#a1)"/>
 <text x="180" y="105" fill="var(--bad)" font-size="12" text-anchor="middle">✗ 不會幫你動手執行</text>
 <text x="540" y="22" fill="var(--accent)" font-size="14" font-weight="bold" text-anchor="middle">程式設計代理（計程車司機）</text>
 <rect x="400" y="40" width="280" height="170" rx="10" fill="var(--panel2)" stroke="var(--accent)" stroke-width="1.5"/>
 <g fill="var(--txt)" text-anchor="middle">
  <rect x="420" y="55" width="110" height="30" rx="6" fill="var(--chip)"/><text x="475" y="75">理解需求</text>
  <rect x="550" y="55" width="110" height="30" rx="6" fill="var(--chip)"/><text x="605" y="75">拆解任務</text>
  <rect x="420" y="100" width="110" height="30" rx="6" fill="var(--chip)"/><text x="475" y="120">產生/修改程式</text>
  <rect x="550" y="100" width="110" height="30" rx="6" fill="var(--chip)"/><text x="605" y="120">使用工具</text>
  <rect x="485" y="145" width="110" height="30" rx="6" fill="var(--chip)"/><text x="540" y="165">遇錯自己修</text>
 </g>
 <text x="540" y="198" fill="var(--ok)" font-size="12" text-anchor="middle">✓ 自主完成、直接交出成果</text>
 <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)"/></marker></defs>
</svg><div class="figcap">圖 1：聊天 AI 與程式設計代理的差別</div></div>
<p>程式設計代理的五個關鍵特徵：</p>
<ul>
<li><b>以自然語言理解需求</b>：用中文講「幫我做一個登入頁面」它聽得懂。</li>
<li><b>自主拆解任務</b>：自己把大任務切成「先建檔 → 寫畫面 → 測試」這種小步驟。</li>
<li><b>產生與修改程式碼</b>：不只新建，也能改既有程式。</li>
<li><b>使用工具</b>：讀寫檔案、執行指令、上網查資料。</li>
<li><b>處理錯誤</b>：跑出錯時自己看錯誤訊息、嘗試修正，而不是停下等你。</li>
</ul>
<h4>為什麼是「現在」紅起來？</h4>
<p>作者歸納四個原因，記成「技術成熟 ＋ 市場需要 ＋ 社會接受 ＋ 任務適合」：</p>
<ol>
<li><b>技術進步</b>：LLM 推論變強、能讀很長的內容（長文脈）、會使用工具。</li>
<li><b>工程師短缺</b>：軟體需求一直增加，但工程師難招、人事成本高。</li>
<li><b>社會接受度提高</b>：大家越來越習慣用 AI，遠距工作普及，世代交替。</li>
<li><b>軟體開發本身好評估</b>：程式跑得動就是跑得動，產出明確、回饋循環快，很適合交給 AI。</li>
</ol>
<h3>1.2 程式設計代理的演進史</h3>
<table>
<tr><th>年份</th><th>產品</th><th>意義</th></tr>

<h3>1.3 Claude Code 的三大強項</h3>
<ol>
<li><b>對規格驅動開發的適性</b>：很適合「先寫清楚要做什麼，再讓 AI 照規格做」的流程（全書最重要觀念，第 4 章詳談）。</li>
<li><b>任務拆解能力</b>：把模糊大需求拆成可執行的小任務。</li>

<h3>1.4 工程師的工作會怎麼改變</h3>

<p><b>為何「現在」才紅？</b>四個因素：① LLM 與代理技術進步（推論強、長文脈、會用工具）② 軟體需求增、工程師短缺＆成本高 ③ 社會對 AI 的接受度提高、遠距工作普及 ④ 「軟體開發」本身產出好評估（跑得動/跑不動立刻知道、小循環、效益易感受）。</p>

<p>示範：請它「用 index.html 和 main.js 實作打磚塊」，它會一次建立多檔；也能讓它執行指令（如 <code>npx http-server</code> 起伺服器）。用 <code>@檔名</code> 讓它參照特定檔案，例如「請解說 <code>@main.js</code>」。完全憑感覺、忘了程式碼存在的寫法叫 <b>Vibe Coding</b>。</p>
<h4>2.5 其他基本功能</h4>
<p><b>斜線指令</b>（以 / 開頭）：</p>
<table>

<tr><td>/clear</td><td>清除對話歷史</td></tr>
<tr><td>/compact</td><td>摘要對話歷史</td></tr>
<tr><td>/init</td><td>產生 CLAUDE.md</td></tr>
<tr><td>/resume</td><td>重開工作階段</td></tr>
<tr><td>/exit</td><td>結束</td></tr>
</table>
<div class="callout key"><span class="lbl">🧠 CLAUDE.md＝Claude Code 的「記憶」</span>
記錄專案規則與基礎知識；Claude Code 會自動讀取目前或上層目錄的 CLAUDE.md。可用 <code>/init</code> 自動產生。它是後面規格驅動開發的核心。</div>
<p><b>計畫模式（plan mode）</b>：按 <code>shift+tab</code> 在「一般→自動編輯→計畫」間切換；計畫模式讓 Claude Code 唯讀作業（只探索/規劃、不改檔）。<code>claude --continue</code> 或 <code>/resume</code> 可重開先前工作階段。</p>

<h3>📖 完整內容（逐節詳解）</h3>
<h4>3.1 MCP 入門</h4>
<p><b>MCP（Model Context Protocol）</b>是 Anthropic 提出、標準化「AI 應用程式 ↔ 外部系統」連線的協定，被喻為「AI 應用程式的 USB-C 連接埠」。</p>
<div class="callout key"><span class="lbl">🔌 出現前 vs 出現後</span>
出現前：每家連線方式各異，只有支援相同方式的組合才能連（N×M 的痛苦）。出現後：只要支援 MCP 就能互連，開發方各自支援 MCP 即可任意組合。</div>
<p><b>架構鏈</b>：AI 應用程式（MCP 主機）→ 內含 MCP 用戶端 → 連本機/遠端 MCP 伺服器 → 連外部系統（瀏覽器、GitHub…）。<b>主要功能</b>有 Tools、Resources、Prompts、Roots、Sampling、Elicitation，目前主要用 <b>Tools</b>（提供模型可呼叫的工具）。</p>
<h4>3.2 在 Claude Code 試用（Playwright MCP）</h4>
<p>在 <code>.mcp.json</code> 設定，或用 <code>claude mcp</code> 指令。範例設定：</p>
<pre><code>{
  "mcpServers": {
    "playwright": {
      "command": "npx",
      "args": ["@playwright/mcp@latest","--browser","chromium","--isolated","--no-sandbox"]
    }
  }
}</code></pre>
<p>重啟 Claude Code 會偵測到新 MCP 並請你核准啟用。之後就能請它「開網頁、截圖」——每個操作會逐一請求許可。</p>
<div class="callout tip"><span class="lbl">⚠️ 安全提醒</span>瀏覽器操作可能把含機密的請求送往非預期網站，因此「未核准就自動操作」需特別小心。</div>
<h4>3.3 實用 MCP 伺服器</h4>
<table>
<tr><th>MCP</th><th>用途</th></tr>

<tr><td>Serena</td><td>符號級程式碼搜尋/重新命名/追蹤，提升程式設計效能</td></tr>
<tr><td>Chrome DevTools</td><td>效能分析、網路請求、console 訊息</td></tr>
</table>
<div class="callout key"><span class="lbl">💡 用 MCP？還是做成指令？</span>
要給代理額外工具，未必非用 MCP。代理本就能執行指令，所以也可把工具做成 CLI。<b>現成工具用 MCP；專案內的小工具，常更適合做成指令。</b></div>

body:`
<p>這章是<b>解法總集</b>，對應第 6 章三大課題提出三條解決路線。工具很多，但抓住「每個工具解決哪個課題」這條主線就不會亂。</p>
<h3>7.1 情境工程（解決課題 1：忘記指示）</h3>
<div class="callout key"><span class="lbl">🔑 什麼是情境工程</span>情境工程＝<b>有策略地管理「放進 AI 情境視窗裡的東西」</b>，讓它在長任務中不忘重點、不被雜訊拖累。三項策略：</div>
<ol>
<li><b>壓縮（Compaction）</b>：主動清掉用不到的東西。做法：清除工具結果、依里程碑刪除歷史、<b>壓縮前先把重要資訊外部化</b>（存到檔案）。挑<b>好時機</b>壓縮（任務告一段落），別在關鍵推理到一半時壓。</li>
<li><b>結構化筆記（Structured Note-Taking）</b>：把任務需求、實作方針、任務清單、卡關紀錄、重要決定，<b>寫成結構化外部筆記</b>。即使情境被壓縮，看筆記就能接回來。</li>
<li><b>子代理架構（Sub-agent）</b>：把某類工作丟給<b>獨立的子代理</b>，它有<b>自己分離的情境</b>，做完只回報「精簡結論」給主代理，避免大量細節污染主代理情境。</li>
</ol>
<div class="callout ex"><span class="lbl">🌰 子代理實例：測試專家</span>定義一個「測試執行與錯誤分析」子代理：被呼叫時跑測試、找出失敗、分析錯誤、回報「成功/失敗數＋失敗清單＋原因＋建議修正」。它把一大堆測試輸出在自己情境裡消化掉，只給主代理一份簡潔報告。</div>
<h3>7.2 提升指示追從性（解決課題 2：不照意圖）</h3>
<table>
<tr><th>機制</th><th>它是什麼</th><th>怎麼被使用</th></tr>
<tr><td><b>斜線指令</b></td><td>把一套<b>明確流程</b>寫成可重複呼叫的指令</td><td>你<b>明確輸入</b> <code>/指令名</code> 才執行</td></tr>
<tr><td><b>技能 Skill</b></td><td>教 AI 某類任務的<b>做法與思維</b></td><td>Claude Code <b>自動判斷</b>相關時載入</td></tr>
<tr><td><b>CLAUDE.md</b></td><td>專案的恆久規則</td><td><b>永遠全文</b>載入情境</td></tr>
<tr><td><b>鉤子 Hook</b></td><td>用<b>程式規則強制</b>在某時機檢查</td><td>事件觸發時<b>一定</b>執行</td></tr>
</table>

<div class="callout ex"><span class="lbl">🌰 斜線指令：標準化「新增功能」</span>寫一個 <code>/add-feature</code>：①讀 CLAUDE.md 掌握全貌 ②用 Grep 搜尋類似既有功能、讀實作 ③沿用既有樣式實作 ④跑測試，錯了就修 ⑤更新文件。把專家的「隱性期待」變成白紙黑字。</div>
<div class="callout ex"><span class="lbl">🌰 鉤子：守門員</span>PreToolUse 鉤子在「工具執行前」檢查，可<b>阻擋</b>不該發生的操作（如禁止編輯某些檔案）。因為是程式判斷，不像提示可能被 AI 忽略，所以最可靠。其他鉤子如 PostToolUse（執行後處理）、Stop（自訂通知）。</div>
<div class="callout tip"><span class="lbl">📖 技能怎麼建</span>技能核心是一個 <code>SKILL.md</code>（frontmatter 中繼資料＋內容），可附最佳實務與程式碼範例。<b>含程式碼範例能提升 AI 推論效能</b>。技能由 Claude Code 自動判斷使用。</div>
<h3>7.3 強化與外部系統的連動（解決課題 3）</h3>
<table>
<tr><th>方式</th><th>說明</th></tr>
<tr><td><b>MCP</b></td><td>用標準協定新增工具。適合結構化、反覆使用的連動。</td></tr>
<tr><td><b>指令式連動</b></td><td>直接活用既有 CLI 工具，或自製 CLI 工具。適合輕量、一次性的事。</td></tr>
</table>
<div class="callout key"><span class="lbl">🔑 MCP 與技能是互補的</span><b>MCP 新增「能做的操作」（工具）；技能教「既有工具怎麼用」（做法）。</b>兩者搭配，能力與用法都齊全。</div>
<h4>安全機制：Sandboxing 與 Dev Container</h4>
<ul>
<li><b>Sandboxing（沙箱）</b>：隔離檔案系統與網路，讓「安全的指令免核准執行」，兼顧效率與安全，設有<b>逃生艙（escape hatch）</b>機制。</li>
<li><b>Dev Container</b>：更完整的環境隔離，適合團隊共享一致環境、做精密網路控制。</li>
<li><b><code>--dangerously-skip-permissions</code></b>：跳過所有權限確認，如名稱所示「危險」，務必在隔離環境中才用。</li>
</ul>
<div class="callout tip"><span class="lbl">⚠️ 資安提醒（呼應公司 ISMS 規範）</span>跳過權限、開放網路雖方便但風險高。處理公司專案時應在隔離環境（Sandbox/Dev Container）內操作，避免機敏資料外流或誤刪重要檔案。</div>
<div class="callout key"><span class="lbl">🔑 7.4 課題與解法對照</span>課題1 忘記指示 → <b>情境工程</b>（壓縮、結構化筆記、子代理）；課題2 不照意圖 → <b>斜線指令/技能/CLAUDE.md/鉤子</b>；課題3 外部連動 → <b>MCP/指令式連動</b>，並用 Sandboxing/Dev Container 保安全。</div>

<h3>📖 完整內容（逐節詳解）</h3>
<h4>7.1 情境工程三策略</h4>
<table>
<tr><th>策略</th><th>做法</th><th>效果</th></tr>
<tr><td>壓縮 Compaction</td><td>把舊記憶摘要、延續新情境</td><td>保連續性、騰出容量</td></tr>
<tr><td>結構化筆記</td><td>把重要資訊寫到外部檔案持久化</td><td>不受壓縮影響</td></tr>
<tr><td>子代理</td><td>用獨立情境執行專門任務</td><td>不污染主情境</td></tr>
</table>
<div class="callout tip"><span class="lbl">🤝 子代理的正確用法</span>
有獨立情境、做完回傳<b>簡潔報告</b>（報告驅動）。適合：審查、資訊蒐集、大量資料處理。<b>不適合直接做具體實作</b>——它無法存取親代理情境，易偏離意圖。</div>
<h4>7.2 提升指示追從性：三個工具</h4>
<table>
<tr><th>工具</th><th>教什麼</th><th>確實性</th></tr>
<tr><td>斜線指令</td><td>明示「工作流程」（做什麼、什麼順序）</td><td>依賴提示</td></tr>
<tr><td>技能 Skill</td><td>教「工具用法/思維」，自動載入</td><td>依賴提示</td></tr>
<tr><td>鉤子 Hook</td><td>以程式「強制規則」</td><td>100% 確實</td></tr>
</table>
<div class="callout key"><span class="lbl">📚 技能 vs CLAUDE.md（漸進式揭露）</span>
CLAUDE.md 永遠全文載入；技能只在需要時載入（先 name/description → SKILL.md → 輔助檔），省情境。所以 CLAUDE.md 放「整體方針」，技能放「TypeScript 怎麼寫、資安怎麼審」這類局部知識。</div>
<p><b>鉤子</b>共 10 種；<code>PreToolUse</code> 可阻擋（回傳結束碼 <b>2</b> ＝禁止該操作），常用還有 PostToolUse（自動格式化）、Notification、Stop（通知）。</p>
<h4>7.3 外部連動與安全</h4>
<p><b>MCP 增加「能做什麼」，技能定義「怎麼用」</b>；也可用 Bash 操作既有/自製 CLI。</p>
<div class="callout tip"><span class="lbl">🔒 Sandboxing 與 Dev Container</span>

<p>第 4 章「手動」走完一次規格驅動開發。第 8、9 章要把它<b>變成可重複的機制</b>──讓每次開發都自動照同一套高品質流程走。本章是<b>設計篇</b>：規劃這套機制長什麼樣。</p>
<h3>8.2 機制化的基本設計</h3>
<p>核心想法：<b>用斜線指令把整個工作流程串起來</b>，每步對應一個指令：</p>
<table>
<tr><th>步驟</th><th>對應斜線指令</th><th>做什麼</th></tr>

<tr><td>3</td><td>文件品質審查與修正</td><td>請子代理審查、提出改善</td></tr>
<tr><td>4</td><td>功能開發</td><td>建引導檔、依任務清單實作</td></tr>
</table>
<div class="callout key"><span class="lbl">🔑 三種元件的分工（最重要的整合觀念）</span><b>技能＝定義「做法」</b>（怎麼寫某類文件/程式）；<b>斜線指令＝定義「流程」</b>（先做什麼再做什麼）；<b>子代理＝負責「獨立的驗證／分析」</b>（在分離情境裡審查、驗證）。三者各司其職，組成一條自動化生產線。</div>

<li><b>文件生成技能</b>：如「建立 PRD 的詳細指南與範本」，只在建 PRD 時用。善用<b>範本＋佔位符</b>，並用<b>斷定式、定量、具體判斷基準</b>的提示寫法。</li>
<li><b>開發流程技能（steering）</b>：分三模式──①計畫階段建引導檔 ②實作階段監視任務清單 ③驗證階段回顧流程。</li>
</ul>
<h3>8.5 以子代理進行情境工程</h3>
<ul>
<li><b>doc-reviewer</b>：在獨立情境裡<b>詳細審查文件品質</b>並提改善建議。</li>
<li><b>implementation-validator</b>：邊參照需求文件、邊<b>驗證實作</b>是否符合規格。</li>
</ul>

<h4>8.2–8.3 三個斜線指令把流程機制化</h4>
<table>

<tr><td>/review-docs</td><td>用 doc-reviewer 子代理審查文件</td></tr>

<div class="callout tip"><span class="lbl">🧱 先準備好環境</span>
SetupBench 論文顯示「環境建構對 AI 代理是高難度任務」。長期專案宜由人類事先建好環境。<b>提示叫它跑的指令（如 npm run lint）一定要能成功</b>，否則 Claude Code 會陷入恐慌、動作不穩。</div>

<p>技能分「成果物單位」（prd-writing 等文件生成）與「任務狀況單位」（steering、development-guidelines）。</p>

body:`

  let h='<div class="quiz"><h3>📝 本章測驗（'+ch.quiz.length+' 題）</h3>';
  ch.quiz.forEach((q,qi)=>{
    h+='<div class="q" data-qi="'+qi+'"><span class="qtype">'+(q.type==='tf'?'是非題':'選擇題')+'</span>'+
       '<div class="qtext">'+(qi+1)+'. '+q.q+'</div>';
    q.options.forEach((o,oi)=>{h+='<label class="opt" data-oi="'+oi+'">'+o+'</label>';});
    h+='<div class="explain"><span class="r"></span><div class="etext">'+q.explain+'</div></div></div>';
  });
  h+='<div class="quiz-score" id="qscore"></div></div>';
  return h;
}
function bindQuiz(ch){
  if(!ch.quiz||!ch.quiz.length)return;
  const answered={};
  main.querySelectorAll('.q').forEach(qel=>{
    const qi=+qel.dataset.qi,q=ch.quiz[qi];
    qel.querySelectorAll('.opt').forEach(opt=>{
      opt.onclick=()=>{
        if(answered[qi]!=null)return;
        const oi=+opt.dataset.oi;answered[qi]=oi;
        const exp=qel.querySelector('.explain'),r=qel.querySelector('.r');
        qel.querySelectorAll('.opt').forEach((o,k)=>{
          o.classList.add('disabled');
          if(k===q.answer)o.classList.add('correct');
          if(k===oi&&oi!==q.answer)o.classList.add('wrong');
        });
        if(oi===q.answer){r.textContent='✓ 答對了！';r.className='r ok';}
        else{r.textContent='✗ 答錯了。正確答案：'+q.options[q.answer];r.className='r bad';}
        exp.classList.add('show');
        if(Object.keys(answered).length===ch.quiz.length)finishQuiz(ch,answered);
      };
    });
  });
}
function finishQuiz(ch,answered){
  let got=0;ch.quiz.forEach((q,qi)=>{if(answered[qi]===q.answer)got++;});
  const total=ch.quiz.length;state.scores[ch.id]={got,total};save();
  const el=document.getElementById('qscore');
  let msg=got===total?'🎉 全對！觀念非常清楚！':got>=total*0.6?'👍 不錯，再複習標錯的觀念。':'💪 別氣餒，回頭看一次重點再來挑戰。';
  el.innerHTML='本章得分：<b>'+got+' / '+total+'</b>　'+msg;
  el.classList.add('show');
  buildNav();navActive(DATA.indexOf(ch));
}
function stripTags(h){return h.replace(/<[^>]+>/g,' ')}
document.getElementById('search').oninput=function(){
  const kw=this.value.trim(),box=document.getElementById('searchResults');
  if(!kw){box.innerHTML='';return;}
  const res=[];
  DATA.forEach((ch,i)=>{
    const text=stripTags(ch.title+' '+ch.body),idx=text.toLowerCase().indexOf(kw.toLowerCase());
    if(idx>=0){
      const s=Math.max(0,idx-15),snip=text.slice(s,idx+kw.length+25);
      const hl=snip.replace(new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
      res.push('<div class="sr" onclick="show('+i+')">'+ch.nav+'：…'+hl+'…</div>');
    }
  });
  box.innerHTML=res.length?res.join(''):'<div style="color:var(--muted);padding:6px">找不到「'+kw+'」</div>';
};
document.getElementById('resetBtn').onclick=function(){
  if(confirm('確定要清除所有已讀紀錄與測驗分數嗎？')){state={read:{},scores:{}};save();buildNav();show(0);}
};
buildNav();show(0);
</script>
</body>
